# BLACKBOX local stack (Phase 1: backend + frontend only).
#
# Run from the repository root so paths and .env resolve there:
#   docker compose -f infra/docker-compose.yml --project-directory . -p blackbox up -d --build
# (or `make up`). The Switch stack is NOT part of this file; it is added in the Switch phase.

services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      BLACKBOX_DATABASE_URL: sqlite:////data/blackbox.db
    ports:
      - "127.0.0.1:${BLACKBOX_BACKEND_PORT:-8010}:8010"
    volumes:
      - backend-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${BLACKBOX_WEB_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
